# ~/.config/starship.toml

# 1. Module Layout (Context Badge + Directory)
format = """
${custom.gcp}\
${custom.gcp_k8s}\
$directory\
$character"""

# ---------------------------------------------------
# 2. Native Module Configurations
# ---------------------------------------------------
[username]
disabled = true

[hostname]
disabled = true

[directory]
disabled = false
style = "bold blue"
format = " [$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncate_to_repo = true
read_only = " 🔒"

[character]
success_symbol = "[➜](bold green) "
error_symbol = "[➜](bold red) "

[gcloud]
disabled = true

[kubernetes]
disabled = true

# ---------------------------------------------------
# 3. [GCP Module] - Displays GCP Project and Account (Dynamic & Real-time)
# ---------------------------------------------------
[custom.gcp]
description = "GCP Project and Account Badge"
when = 'test "$GCP_WORKSPACE_ACTIVE" = "true" && test "$STARSHIP_KUBE_ENABLED" != "true"'
command = '''
  ACTIVE_CFG="default"
  [ -f "$HOME/.config/gcloud/active_config" ] && ACTIVE_CFG=$(tr -d '\r\n' < "$HOME/.config/gcloud/active_config")
  CFG_FILE="$HOME/.config/gcloud/configurations/config_${ACTIVE_CFG}"

  PROJ=""
  ACCT=""
  if [ -f "$CFG_FILE" ]; then
    PROJ=$(awk -F' = ' '/^project/ {print $2}' "$CFG_FILE" | tr -d ' ')
    ACCT=$(awk -F' = ' '/^account/ {print $2}' "$CFG_FILE" | tr -d ' ')
  fi
  [ -z "$PROJ" ] && PROJ="${GCP_PROJECT:-N/A}"
  [ -z "$ACCT" ] && ACCT="${GCP_ACCOUNT:-$USER@}"

  YELLOW='\033[1;33m'
  RED='\033[1;31m'
  GREEN='\033[1;32m'
  RESET='\033[0m'

  if echo "$ACCT" | grep -q "admin"; then
    echo -e "[${YELLOW}${PROJ}${RESET} | ${RED}admin@${RESET}]"
  else
    USER_PREFIX="${ACCT%%@*}"
    echo -e "[${YELLOW}${PROJ}${RESET} | ${GREEN}${USER_PREFIX:-$USER}@${RESET}]"
  fi
'''
style = "bold cyan"
format = '$output'
shell = ["bash", "--noprofile", "--norc"]

# ---------------------------------------------------
# 4. [K8s Mode] - K8s Context, Namespace, and GCP Project & Account
# ---------------------------------------------------
[custom.gcp_k8s]
description = "Kubernetes Cluster, Namespace, and GCP Project & Account Badge"
when = 'test "$STARSHIP_KUBE_ENABLED" = "true"'
command = '''
  ACTIVE_CFG="default"
  [ -f "$HOME/.config/gcloud/active_config" ] && ACTIVE_CFG=$(tr -d '\r\n' < "$HOME/.config/gcloud/active_config")
  CFG_FILE="$HOME/.config/gcloud/configurations/config_${ACTIVE_CFG}"

  PROJ=""
  ACCT=""
  if [ -f "$CFG_FILE" ]; then
    PROJ=$(awk -F' = ' '/^project/ {print $2}' "$CFG_FILE" | tr -d ' ')
    ACCT=$(awk -F' = ' '/^account/ {print $2}' "$CFG_FILE" | tr -d ' ')
  fi
  [ -z "$PROJ" ] && PROJ="${GCP_PROJECT:-N/A}"
  [ -z "$ACCT" ] && ACCT="${GCP_ACCOUNT:-$USER@}"

  K_INFO=$(kubectl config view --minify -o jsonpath='{.current-context}:{.contexts[0].context.namespace}' 2>/dev/null || echo "N/A:N/A")
  K_CTX="${K_INFO%:*}"
  K_NS="${K_INFO#*:}"
  [ -z "$K_CTX" ] && K_CTX="N/A"
  [ -z "$K_NS" ] && K_NS="default"

  YELLOW='\033[1;33m'
  MAGENTA='\033[1;35m'
  RED='\033[1;31m'
  GREEN='\033[1;32m'
  RESET='\033[0m'

  if echo "$ACCT" | grep -q "admin"; then
    echo -e "[${YELLOW}${K_CTX}${RESET}:${MAGENTA}${K_NS}${RESET} | ${YELLOW}${PROJ}${RESET} | ${RED}admin@${RESET}]"
  else
    USER_PREFIX="${ACCT%%@*}"
    echo -e "[${YELLOW}${K_CTX}${RESET}:${MAGENTA}${K_NS}${RESET} | ${YELLOW}${PROJ}${RESET} | ${GREEN}${USER_PREFIX:-$USER}@${RESET}]"
  fi
'''
style = "bold cyan"
format = '$output'
shell = ["bash", "--noprofile", "--norc"]
